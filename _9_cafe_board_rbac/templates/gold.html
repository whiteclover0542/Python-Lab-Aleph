<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가디언 룸 - 카페이야기</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  {% include 'partials/_nav.html' %}

  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="page-content">
      <div class="text-center text-gray-400 py-12">불러오는 중...</div>
    </div>
  </main>

  {% include 'partials/_auth_modal.html' %}

  <script src="/static/js/site.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 요구사항 6: 가디언(1) 미만이면 guardPage 가 #page-content 에 예외화면을 그리고 끝낸다.
      Site.guardPage(1, 'page-content', loadLounge);
    });

    async function loadLounge(me) {
      const res = await fetch('/api/gold/lounge', {
        headers: { Authorization: `Bearer ${Site.getToken()}` },
      });
      const data = await res.json();
      const container = document.getElementById('page-content');

      // 페이지 진입 후 실제 데이터 API 를 호출하는 시점에도 서버가 한 번 더 막는다(방어선 2단계).
      if (!res.ok) {
        container.innerHTML = Site.forbiddenHtml(data.msg, 1, me.role);
        return;
      }

      container.innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm">
          <h2 class="text-lg font-bold text-amber-700 mb-3">🛡 가디언 룸</h2>
          <p class="text-gray-700 mb-4">${Site.escapeHtml(data.msg)}</p>
          <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
            ${data.benefits.map(b => `<li>${Site.escapeHtml(b)}</li>`).join('')}
          </ul>
        </div>`;
    }
  </script>
</body>
</html>
